apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: it-tools-ingress
  namespace: testing
spec:
  ingressClassName: traefik # Spiega a Kubernetes che il gestore è Traefik
  rules:
  - host: it-tools.flowingbot.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: it-tools # Deve corrispondere al nome del tuo Service standard
            port:
              number: 80 # La porta interna del Service