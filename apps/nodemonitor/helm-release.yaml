apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nodemonitor
  namespace: monitoring
spec:
  interval: 5m
  chart:
    spec:
      chart: nodemonitor
      version: "0.1.1"
      sourceRef:
        kind: HelmRepository
        name: nodemonitor
        namespace: flux-system
  values:
    monitoring:
      containerRuntimeSocket: /run/k3s/containerd/containerd.sock