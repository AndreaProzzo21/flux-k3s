apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nodemonitor-ingress
  namespace: monitoring
spec:
  ingressClassName: traefik # Spiega a Kubernetes che il gestore è Traefik
  rules:
  - host: node.flowingbot.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: nodemonitor # Deve corrispondere al nome del tuo Service standard
            port:
              number: 80 # La porta interna del Service
