apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage-config
  namespace: homepage
data:
  settings.yaml: |
    title: "Dashboard - Homepage"
    theme: dark
    color: slate
    headerStyle: clean
    cardStyle: glass
    background:
      # Pianeta con nodi neurali/network globali luminosi
      image: https://images.unsplash.com/photo-1451187580459-43490279c0fa?auto=format&fit=crop&w=2560&q=80
      blur: sm
      saturate: 120
      brightness: 65
      opacity: 80
    layout:
      Cluster K3s:
        style: row
        columns: 4
      Home Lab:
        style: row
        columns: 3
      Cluster DIPI:
        style: row
        columns: 2
    quicklaunch:
      searchKeyboardHotkey: "/"
      showSearchSuggestions: true
      hideVisitURL: true
    hideVersion: true
  widgets.yaml: |
    - datetime:
        text_size: 2xl
        format:
          timeStyle: medium
          dateStyle: long
    - kubernetes:
        cluster:
          show: true
          cpu: true
          memory: true
          showLabel: true
          label: "K3s Core Node"
        nodes:
          show: true
          cpu: true
          memory: true
          showLabel: true
  services.yaml: |
    - Cluster K3s:
        - IT-Tools:
            href: "https://it-tools.flowingbot.com"
            description: "Developer Toolbox"
            icon: mdi-toolbox-outline
            siteMonitor: "https://it-tools.flowingbot.com"
        - Node Monitor:
            href: "https://node.flowingbot.com"
            description: "Realtime Metrics"
            icon: mdi-chart-bell-curve-cumulative
            siteMonitor: "https://node.flowingbot.com"
        - VictoriaLogs:
            href: "https://log.flowingbot.com"
            description: "AWS Log Aggregator"
            icon: mdi-text-box-search-outline
            siteMonitor: "https://log.flowingbot.com/select/vmui"
        - RabbitMQ:
            href: "http://35.157.116.50:32002"
            description: "Message Broker"
            icon: si-rabbitmq
    - Home Lab:
        - EdgeHub:
            href: "https://edgehub.flowingbot.com"
            description: "Telemetry & Alerts"
            icon: si-raspberrypi
            siteMonitor: "https://edgehub.flowingbot.com"
        - Secret Share:
            href: "https://secret.flowingbot.com"
            description: "Secure IT Vault"
            icon: mdi-shield-lock-outline
            siteMonitor: "https://secret.flowingbot.com"
        - Landing Page:
            href: "https://www.flowingbot.com"
            description: "FlowingBot Portal"
            icon: mdi-rocket-launch-outline
            siteMonitor: "https://www.flowingbot.com"
    - Cluster DIPI:
        - Grafana:
            href: "http://192.168.0.61:32000"
            description: "Analytics Dashboard"
            icon: si-grafana
        - VictoriaLogs:
            href: "http://192.168.0.61:32001/select/vmui"
            description: "System Logs"
            icon: mdi-database-eye-outline
  bookmarks.yaml: |
    - Developer Hub:
        - GitHub:
            - abbr: GH
              href: "https://github.com/"
              icon: si-github
        - GitLab:
            - abbr: GL
              href: "https://gitlab.com/"
              icon: si-gitlab
        - Cloudflare:
            - abbr: CF
              href: "https://dash.cloudflare.com/"
              icon: si-cloudflare
  docker.yaml: |
    ---
  kubernetes.yaml: |
    mode: cluster