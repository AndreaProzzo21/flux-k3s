apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage-config
  namespace: homepage
data:
  settings.yaml: |
    title: "K3s Flux Lab"
    theme: dark
    color: slate
    headerStyle: boxed

    background:
      image: https://images.unsplash.com/photo-1451187580459-43490279c0fa?auto=format&fit=crop&w=2560&q=80
      blur: xl
      saturate: 50
      brightness: 60
      opacity: 70

    layout:
      Cluster K3s:
        style: row
        columns: 2
      Home Lab:
        style: row
        columns: 2

    quicklaunch:
      searchKeyboardHotkey: "/"
      showSearchSuggestions: true
      hideVisitURL: false

    hideVersion: false

  widgets.yaml: |
    - datetime:
        text_size: xl
        format:
          timeStyle: short
          dateStyle: short

    - kubernetes:
        cluster:
          show: true
          cpu: true
          memory: true
          showLabel: true
          label: "cluster"
        nodes:
          show: true
          cpu: true
          memory: true
          showLabel: true

  # ATTENZIONE: sostituisci <service>.<namespace> con i nomi reali
  # ricavabili con: kubectl get svc -A
  # href resta pubblico (per il click dal browser),
  # siteMonitor usa il DNS interno del cluster per evitare l'hairpin NAT su AWS.
  services.yaml: |
    - Cluster K3s:
        - IT-Tools:
            href: "http://it-tools.35.157.116.50.nip.io/"
            description: "Toolbox sviluppatori"
            icon: it-tools.png
            siteMonitor: "http://it-tools.it-tools.svc.cluster.local"

        - Node Monitor:
            href: "http://35.157.116.50:30090"
            description: "Metriche nodo in tempo reale"
            icon: mdi-chart-line
            siteMonitor: "http://nodemonitor.nodemonitor.svc.cluster.local"

    - Home Lab:
        - EdgeHub (Raspberry):
            href: "https://edgehub.flowingbot.com"
            description: "Telemetria & Alert"
            icon: raspberry-pi.png
            siteMonitor: "https://edgehub.flowingbot.com"

  bookmarks.yaml: |
    - Developer:
        - GitHub:
            - abbr: GH
              href: "https://github.com/"
        - GitLab:
            - abbr: GL
              href: "https://gitlab.com/"

  docker.yaml: ""

  kubernetes.yaml: |
    mode: cluster