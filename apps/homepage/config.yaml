apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage-config
  namespace: homepage
data:
  settings.yaml: |
    title: "Dashboard - K3s Cluster"
    theme: dark
    color: violet
    headerStyle: boxed

    background:
      image: https://images.unsplash.com/photo-1451187580459-43490279c0fa?auto=format&fit=crop&w=2560&q=80
      blur: xl
      saturate: 50
      brightness: 55
      opacity: 65

    layout:
      Cluster K3s:
        style: row
        columns: 2
      Home Lab:
        style: row
        columns: 2

    quicklaunch:
      searchKeyboardHotkey: "/"
      showSearchSuggestions: true
      hideVisitURL: false

    hideVersion: false

  widgets.yaml: |
    - datetime:
        text_size: xl
        format:
          timeStyle: short
          dateStyle: short

    - kubernetes:
        cluster:
          show: true
          cpu: true
          memory: true
          showLabel: true
          label: "cluster"
        nodes:
          show: true
          cpu: true
          memory: true
          showLabel: true

  services.yaml: |
    - Cluster K3s:
        - IT-Tools:
            href: "https://it-tools.flowingbot.com"
            description: "Toolbox sviluppatori"
            icon: mdi-tools
            siteMonitor: "https://it-tools.flowingbot.com"

        - Node Monitor:
            href: "https://node.flowingbot.com"
            description: "Metriche nodo in tempo reale"
            icon: mdi-chart-line
            siteMonitor: "https://node.flowingbot.com"

        - VictoriaLogs UI:
            href: "https://log.flowingbot.com"
            description: "VictoriaLogs Dashboard for Cluster K3s AWS"
            icon: mdi-server
            siteMonitor: "https://log.flowingbot.com/select/vmui"

        - Rabbit MQ UI:
            href: "http://35.157.116.50:32002"
            description: "Rabbit MQ Dashboard Cluster K3s AWS"
            icon: mdi-rabbit
            

    - Home Lab:
        - EdgeHub (Raspberry):
            href: "https://edgehub.flowingbot.com"
            description: "Telemetria & Alert"
            icon: mdi-raspberry-pi
            siteMonitor: "https://edgehub.flowingbot.com"
        - Secret Share (Raspberry):
            href: "https://secret.flowingbot.com"
            description: "Secure IT secret sharing"
            icon: mdi-lock-outline
            siteMonitor: "https://secret.flowingbot.com"
        - Landing Page (Raspberry):
            href: "https://www.flowingbot.com"
            description: "FlowingBot Landing Page"
            icon: mdi-lock-server
            siteMonitor: "https://www.flowingbot.com"
    - Cluster DIPI:
        - Grafana Cluster-DIPI:
            href: "http://192.168.0.61:32000"
            description: "Grafana Dashboard for Cluster-DIPI"
            icon: mdi-server

        - VictoriaLogs UI Cluster-DIPI:
            href: "http://192.168.0.61:32001/select/vmui"
            description: "VictoriaLogs Dashboard for Cluster-DIPI"
            icon: mdi-server
          

  bookmarks.yaml: |
    - Developer:
        - GitHub:
            - abbr: GH
              href: "https://github.com/"
        - GitLab:
            - abbr: GL
              href: "https://gitlab.com/"
        - Cloudflare:
            - abbr: CF
              href: "https://dash.cloudflare.com/"

  docker.yaml: |
    ---

  kubernetes.yaml: |
    mode: cluster