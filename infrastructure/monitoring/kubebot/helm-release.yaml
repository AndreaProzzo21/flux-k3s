apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: botkube
  namespace: monitoring
spec:
  interval: 10m
  chart:
    spec:
      chart: botkube
      version: "~> 1.0"
      sourceRef:
        kind: HelmRepository
        name: botkube
        namespace: flux-system
  valuesFrom:
    - kind: Secret
      name: botkube-discord-secret
  values:
    communications:
      default-group:
        discord:
          # Il binding deve stare DENTRO le impostazioni del canale
          channels:
            default:
              bindings:
                sources:
                  - k8s-err-events
    
    sources:
      k8s-err-events:
        kubernetes:
          namespaces:
            include:
              - ".*"
          events:
            - type: error

    executors: {}

    rbac:
      create: true
      rules:
        - apiGroups: ["*"]
          resources: ["*"]
          verbs: ["get", "watch", "list"]