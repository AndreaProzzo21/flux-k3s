apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: botkube
  namespace: monitoring
spec:
  interval: 10m
  chart:
    spec:
      chart: botkube
      version: ">= 1.14.0" # Scarica la versione più recente
      sourceRef:
        kind: HelmRepository
        name: botkube
        namespace: flux-system
  valuesFrom:
    - kind: Secret
      name: botkube-discord-secret
  values:
    # Da un nome al tuo cluster per Discord
    settings:
      clusterName: "k3s-cluster"

    communications:
      default-group:
        discord:
          channels:
            default:
              bindings:
                sources:
                  - k8s-err-events
    
    # La configurazione corretta per v1+
    sources:
      k8s-err-events:
        kubernetes:
          resources:
            - type: v1/pods
              namespaces:
                include:
                  - ".*"
              events:
                - error
            - type: v1/nodes
              namespaces:
                include:
                  - ".*"
              events:
                - error
            - type: apps/v1/deployments
              namespaces:
                include:
                  - ".*"
              events:
                - error

    executors: {}

    rbac:
      create: true
      rules:
        - apiGroups: ["*"]
          resources: ["*"]
          verbs: ["get", "watch", "list"]