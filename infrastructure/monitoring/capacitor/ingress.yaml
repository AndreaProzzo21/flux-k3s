apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: capacitor-ingress
  namespace: flux-system
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
  - host: weave.flowingbot.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            # A volte Traefik ha bisogno di capire che il servizio è 
            # nel namespace dell'Ingress se non ha permessi cluster-wide
            name: capacitor
            port:
              number: 9000