apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: bitnami
  namespace: flux-system
spec:
  # Diciamo a Flux che questo è un registry OCI, non un vecchio server web
  type: oci
  interval: 24h
  # Il nuovo indirizzo ufficiale delle chart Bitnami su Docker Hub
  url: oci://registry-1.docker.io/bitnamicharts