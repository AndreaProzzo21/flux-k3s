apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: rabbit-mq
spec:
  type: NodePort
  selector:
    app: rabbitmq
  ports:
    - name: amqp
      port: 5672
      targetPort: 5672
      nodePort: 32010
    - name: mqtt
      port: 1883
      targetPort: 1883
      nodePort: 32011
    - name: manager
      port: 15672
      targetPort: 15672
      nodePort: 32002