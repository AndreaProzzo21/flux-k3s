apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rabbit-mq
  namespace: flux-system
spec:
  interval: 1h
  targetNamespace: rabbit-mq
  install:
    createNamespace: true
  chart:
    spec:
      chart: rabbitmq
      version: ">=16.0.0"
      sourceRef:
        kind: HelmRepository
        name: bitnami
        namespace: flux-system
  values:
    # --- AGGIUNTA PER BYPASSARE I TAG CANCELLATI ---
    image:
      tag: "latest"
    # -----------------------------------------------
    
    auth:
      username: admin
      existingPasswordSecret: rabbitmq-auth
      existingSecretPasswordKey: rabbitmq-password
    
    extraPlugins: "rabbitmq_management rabbitmq_mqtt"
    
    service:
      type: NodePort
      nodePorts:
        amqp: 32010
        mqtt: 32011
        manager: 32002
        
    persistence:
      enabled: true
      size: 2Gi

    resources:
      requests:
        cpu: 250m
        memory: 128Mi
      limits:
        memory: 256Mi