apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: victoriametrics
  namespace: flux-system
spec:
  interval: 24h
  url: https://victoriametrics.github.io/helm-charts/
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: victorialogs
  namespace: logging
spec:
  interval: 1h
  chart:
    spec:
      chart: victoria-logs-single
      version: ">=0.6.0"
      sourceRef:
        kind: HelmRepository
        name: victoriametrics
        namespace: flux-system
  install:
    createNamespace: true
  values:
    server:
      persistentVolume:
        enabled: true
        size: 4Gi

      retentionPeriod: "30d"

      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          memory: 256Mi