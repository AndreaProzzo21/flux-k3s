apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: victorialogs-ingress
  namespace: logging
spec:
  ingressClassName: traefik
  rules:
  - host: log.flowingbot.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: victorialogs-victoria-logs-single-server
            port:
              number: 9428