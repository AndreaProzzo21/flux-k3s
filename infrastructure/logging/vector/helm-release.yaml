apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vector
  namespace: logging
spec:
  interval: 1h
  chart:
    spec:
      chart: vector
      version: ">=0.30.0"
      sourceRef:
        kind: HelmRepository
        name: vector
        namespace: flux-system
  install:
    createNamespace: true
  values:
    role: Agent

    service:
      enabled: false

    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 256Mi

    customConfig:
      data_dir: /vector-data-dir

      sources:
        kubernetes_logs:
          type: kubernetes_logs
          extra_field_selector: "metadata.namespace!=logging"

      transforms:
        drop_health_checks:
          type: filter
          inputs:
            - kubernetes_logs
          condition: '!contains(string!(.message), "GET /health")'

      sinks:
        to_victorialogs:
          type: elasticsearch
          inputs:
            - drop_health_checks
          endpoints:
            - http://victorialogs-victoria-logs-single-server.logging.svc.cluster.local:9428/insert/elasticsearch/
          mode: bulk
          api_version: v8
          healthcheck:
            enabled: true
          buffer:
            type: disk
            max_size: 268435488
            when_full: block
          query:
            _msg_field: message
            _time_field: timestamp
            _stream_fields: "kubernetes.pod_namespace,kubernetes.pod_name,kubernetes.container_name"