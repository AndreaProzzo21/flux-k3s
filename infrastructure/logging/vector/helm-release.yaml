apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: vector
  namespace: flux-system
spec:
  interval: 24h
  url: https://helm.vector.dev
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vector
  namespace: logging
spec:
  interval: 1h
  chart:
    spec:
      chart: vector
      version: ">=0.30.0"
      sourceRef:
        kind: HelmRepository
        name: vector
        namespace: flux-system
  install:
    createNamespace: true
  values:
    # Vector girerà come DaemonSet (Agent)
    role: Agent
    
    # Questa è la pipeline di elaborazione
    customConfig:
      data_dir: /vector-data-dir
      
      # Sorgente: Raccoglie i log nativi di Kubernetes
      sources:
        kubernetes_logs:
          type: kubernetes_logs
          
      # Destinazione: Invia a VictoriaLogs
      sinks:
        to_victorialogs:
          type: http
          inputs: 
            - kubernetes_logs
          # Usiamo l'endpoint nativo jsonline invece di elasticsearch
          uri: "http://victorialogs-victoria-logs-single-server:9428/insert/jsonline?_msg_field=message&_time_field=timestamp&_stream_fields=kubernetes.pod_namespace,kubernetes.pod_name,kubernetes.container_name"
          encoding:
            codec: json