apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: reloader
  namespace: kube-system
spec:
  interval: 10m
  chart:
    spec:
      chart: reloader
      version: ">=1.1.0"
      sourceRef:
        kind: HelmRepository
        name: stakater
        namespace: flux-system
  values:
    # Opzioni di default ottimali. watchGlobally permette a reloader di guardare tutti i namespace.
    reloader:
      watchGlobally: true