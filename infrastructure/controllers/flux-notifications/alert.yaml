apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Alert
metadata:
  name: flux-discord-alert
  namespace: flux-system
spec:
  providerRef:
    name: discord
  eventSeverity: info # <-- Opzioni: 'info' oppure 'error'
  eventSources:
    - kind: GitRepository
      name: '*'
    - kind: Kustomization
      name: '*'
    - kind: HelmRelease
      name: '*'
    - kind: HelmRepository
      name: '*'