    tunnel: c7fa8dcf-8644-4c92-af17-dfe0cde844c8
    credentials-file: /etc/cloudflared/creds/credentials.json

    ingress:
      - hostname: dash.flowingbot.com
        service: http://traefik.kube-system.svc.cluster.local:80
      - hostname: it-tools.flowingbot.com
        service: http://traefik.kube-system.svc.cluster.local:80
      - hostname: node.flowingbot.com
        service: http://traefik.kube-system.svc.cluster.local:80
      - hostname: weave.flowingbot.com
        service: http://traefik.kube-system.svc.cluster.local:80
      - service: http_status:404